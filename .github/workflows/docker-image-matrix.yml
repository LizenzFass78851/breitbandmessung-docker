name: Build as Matrix and Publish Docker Image

on:
  schedule:
    - cron: '10 14 */3 * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        target: ["stable", "future"]

    runs-on: ubuntu-latest

    env:
      CONTAINER_NAME: test-${{ github.run_id }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ matrix.target == 'stable' }}
          tags: ${{ matrix.target }}

      - name: Build main Docker image
        id: prebuild
        uses: docker/build-push-action@v7
        with:
          build-args: &build-args GH_TOKEN=${{ github.token }}
          context: &context .
          file: &file ./Dockerfile
          cache-to: &cache-to type=gha,mode=max,ignore-error=true
          cache-from: &cache-from type=gha
          push: false
          load: true
          tags: &tags ${{ steps.meta.outputs.tags }}
          labels: &labels ${{ steps.meta.outputs.labels }}

      - name: test - start
        run: |
          sudo docker run -t -d \
          --name ${{ env.CONTAINER_NAME }} \
          $(echo "${{ steps.meta.outputs.tags }}" | head -n1)
      - name: test - check logs
        uses: crazy-max/.github/.github/actions/container-logs-check@main
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "Listening for HTTP connections on port"
          timeout: 120
      - name: test - specific tests
        env:
          WAITING_SECOND: 20
        run: |
          echo "waiting ${WAITING_SECOND} seconds to check if the container was not exiting" && sleep ${{ env.WAITING_SECOND }}
          if [ "$(docker inspect -f '{{.State.Status}}' ${{ env.CONTAINER_NAME }})" = "exited" ]; then
            echo "Container exited unexpectedly" && exit 1
          else
            echo "Container is running as expected"
          fi
      - name: test - show logs
        if: always()
        run: |
          sudo docker logs ${{ env.CONTAINER_NAME }} || true
      - name: test - stop and remove
        if: always()
        run: |
          sudo docker stop -t 10 ${{ env.CONTAINER_NAME }} || sudo docker stop -s SIGKILL -t 10 ${{ env.CONTAINER_NAME }} || true
          sudo docker rm -f ${{ env.CONTAINER_NAME }}

      - name: Build and push main Docker image
        id: build
        uses: docker/build-push-action@v7
        with: 
          build-args: *build-args
          context: *context
          file: *file
          platforms: linux/amd64
          cache-to: *cache-to
          cache-from: *cache-from
          push: true
          tags: *tags
          labels: *labels
