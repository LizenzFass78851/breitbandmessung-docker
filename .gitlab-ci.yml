variables:
  CI_BUILD_IMAGE: "docker:latest"
  CI_BUILD_AMD64: "enabled"
  CI_BUILD_ARM64: ""
  CI_BUILD_ARMv7: ""
  # For using DOCKER_HUB as registry, set this Var to "true"
  DOCKER_HUB: "true"
  # Override CI_PROJECT_PATH for using correct DOCKERHUB path
  CI_PROJECT_PATH: "fabianbees/breitbandmessung"

# Build Stages
stages:
- build
- release


# Pre-Script: Generate Tags, Login
.build:
  image: $CI_BUILD_IMAGE
  stage: build
  before_script:
    - export BUILD_DATE=$(date '+%Y-%m-%dT%H:%M:%S%:z')
    - |
      export CI_APPLICATION_SHA="$CI_COMMIT_SHORT_SHA"

      if [[ -n "$CI_COMMIT_TAG" ]]; then
        export CI_APPLICATION_TAG="$CI_COMMIT_TAG"
        export CI_APPLICATION_TAG_LATEST=""
      elif [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        export CI_APPLICATION_TAG="latest"
        export CI_APPLICATION_TAG_LATEST="latest"
      else
        export CI_APPLICATION_TAG="$CI_COMMIT_SHORT_SHA"
        export CI_APPLICATION_TAG_LATEST=""
      fi

      echo "Docker image SHA tag: $CI_APPLICATION_SHA"
      echo "Docker image primary tag: $CI_APPLICATION_TAG"
    - |
      if [[ "$DOCKER_HUB" == "true" ]]; then
        export CI_REGISTRY_IMAGE=$CI_PROJECT_PATH
        echo "$DOCKER_REGISTRY_PASS" | docker login $DOCKER_REGISTRY --username $DOCKER_REGISTRY_USER --password-stdin
      else
        echo "$REGISTRY_PASS" | docker login $REGISTRY --username $REGISTRY_USER --password-stdin
      fi


# AMD64 Build
build:amd64:
  extends: .build
  only:
    variables:
      - $CI_BUILD_AMD64
  tags:
    - amd64
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-amd64" .
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-amd64" "$CI_REGISTRY_IMAGE:latest-amd64"
      else
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-amd64" "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-amd64"
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-amd64"
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker push "$CI_REGISTRY_IMAGE:latest-amd64"
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-amd64"
      fi


# ARM64 Build
build:arm64:
  extends: .build
  only:
    variables:
      - $CI_BUILD_ARM64
  tags:
    - arm64
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-arm64" .
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-arm64" "$CI_REGISTRY_IMAGE:latest-arm64"
      else
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-arm64" "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-arm64"
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-arm64"
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker push "$CI_REGISTRY_IMAGE:latest-arm64"
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-arm64"
      fi


# ARMv7 Build
build:armv7:
  extends: .build
  only:
    variables:
      - $CI_BUILD_ARMv7
  tags:
    - armv7
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-armv7" .
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-armv7" "$CI_REGISTRY_IMAGE:latest-armv7"
      else
        docker tag "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-armv7" "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-armv7"
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-armv7"
    - |
      if [[ "$CI_APPLICATION_TAG" == "latest" ]]; then
        docker push "$CI_REGISTRY_IMAGE:latest-armv7"
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_APPLICATION_TAG-armv7"
      fi



# Building & Pushing Manifest
build:manifest:
  extends: .build
  stage: release
  script:
    - echo "Checking amd86 build..." && [[ $CI_BUILD_AMD64 ]] && echo "found" && export CI_MANIFEST_LIST="$CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-amd64"
    - echo "Checking arm64 build..." && [[ $CI_BUILD_ARM64 ]] && echo "found" && export CI_MANIFEST_LIST="$CI_MANIFEST_LIST $CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-arm64"
    - echo "Checking arm build..." && [[ $CI_BUILD_ARMv7 ]] && echo "found" && export CI_MANIFEST_LIST="$CI_MANIFEST_LIST $CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA-armv7"
    - export DOCKER_CLI_EXPERIMENTAL=enabled
    - echo $CI_MANIFEST_LIST
    - docker manifest create $CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA $CI_MANIFEST_LIST && docker manifest push $CI_REGISTRY_IMAGE:$CI_APPLICATION_SHA
    - |
      if [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        export CI_MANIFEST_LIST_LATEST=""
        [[ $CI_BUILD_AMD64 ]] && export CI_MANIFEST_LIST_LATEST="$CI_MANIFEST_LIST_LATEST $CI_REGISTRY_IMAGE:latest-amd64"
        [[ $CI_BUILD_ARM64 ]] && export CI_MANIFEST_LIST_LATEST="$CI_MANIFEST_LIST_LATEST $CI_REGISTRY_IMAGE:latest-arm64"
        [[ $CI_BUILD_ARMv7 ]] && export CI_MANIFEST_LIST_LATEST="$CI_MANIFEST_LIST_LATEST $CI_REGISTRY_IMAGE:latest-armv7"
        echo $CI_MANIFEST_LIST_LATEST
        docker manifest create $CI_REGISTRY_IMAGE:latest $CI_MANIFEST_LIST_LATEST && docker manifest push $CI_REGISTRY_IMAGE:latest
      fi
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        export CI_MANIFEST_LIST_TAG=""
        [[ $CI_BUILD_AMD64 ]] && export CI_MANIFEST_LIST_TAG="$CI_MANIFEST_LIST_TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64"
        [[ $CI_BUILD_ARM64 ]] && export CI_MANIFEST_LIST_TAG="$CI_MANIFEST_LIST_TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64"
        [[ $CI_BUILD_ARMv7 ]] && export CI_MANIFEST_LIST_TAG="$CI_MANIFEST_LIST_TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-armv7"
        echo $CI_MANIFEST_LIST_TAG
        docker manifest create $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_MANIFEST_LIST_TAG && docker manifest push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      fi
